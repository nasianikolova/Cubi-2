; Cubi 2 - cubi2_setup for the Teensy 4.1 on board Y.
; VS Code + PlatformIO: File > Open Folder > this folder. Then the bottom bar:
;   check mark = Build,  arrow = Upload,  plug = Serial Monitor.

[platformio]
src_dir = .                       ; the program files stay next to this file

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D USB_SERIAL       ; the USB is a serial port (the Serial Monitor)
build_src_filter = +<*.cpp>
lib_deps =
    https://github.com/sparkfun/SparkFun_BMI270_Arduino_Library.git#v1.0.3   ; the IMU library, fixed version
; FlexCAN_T4, Wire and EEPROM come with the Teensy platform
monitor_speed = 115200
monitor_echo = yes                ; you see what you type
monitor_eol = LF                  ; Enter sends the line (like 'Newline')
monitor_filters = send_on_enter
