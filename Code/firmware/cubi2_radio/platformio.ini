; Cubi 2 - cubi2_radio for the Wi-Fi board on board X (Beetle ESP32-C6).
; VS Code + PlatformIO: File > Open Folder > this folder. Then the bottom bar:
;   check mark = Build,  arrow = Upload,  plug = Serial Monitor.
;
; (20/10/2026) The ESP32-C6 needs the Arduino core 3. The official espressif32 platform
; of PlatformIO stops at core 2, so this uses the community platform 'pioarduino'
; (release 55.03.311 = Arduino core 3.3.11). The first Build
; downloads it - a few minutes.

[platformio]
src_dir = .

[env:beetle_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1        ; the same chip; the Beetle's pins are used by number
board_upload.flash_size = 4MB     ; the Beetle has 4 MB
board_build.partitions = default.csv
framework = arduino
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; the USB is a serial port from the start (its messages)
build_src_filter = +<*.cpp>
extra_scripts = post:../make_update_file.py   ; (24/10/2026) after each Build: the program into ../cubi2_firmware.upd (the app's Update)
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
